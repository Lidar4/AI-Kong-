<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" opacity="0.6" />

  <!-- Inner ambient aura -->
  <circle cx="256" cy="240" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  
  <!-- AI Bondhu stylized mascot/emblem: Friendly robot & lotus heart -->
  <g transform="translate(106, 96)">
    <!-- Outer Shield / Halo -->
    <path d="M150 15 C230 15 285 70 285 150 C285 240 190 280 150 305 C110 280 15 240 15 150 C15 70 70 15 150 15 Z" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    
    <!-- Sparkles / Constellations -->
    <circle cx="150" cy="70" r="10" fill="#10b981" />
    <circle cx="85" cy="140" r="8" fill="#06b6d4" />
    <circle cx="215" cy="140" r="8" fill="#3b82f6" />
    <circle cx="150" cy="215" r="12" fill="#10b981" />

    <!-- Connecting neural nodes -->
    <line x1="150" y1="70" x2="85" y2="140" stroke="#06b6d4" stroke-width="4" stroke-dasharray="6,6" opacity="0.8" />
    <line x1="150" y1="70" x2="215" y2="140" stroke="#3b82f6" stroke-width="4" stroke-dasharray="6,6" opacity="0.8" />
    <line x1="85" y1="140" x2="150" y2="215" stroke="#10b981" stroke-width="4" opacity="0.9" />
    <line x1="215" y1="140" x2="150" y2="215" stroke="#10b981" stroke-width="4" opacity="0.9" />

    <!-- Friendly smiling eye core -->
    <circle cx="115" cy="135" r="14" fill="#ffffff" />
    <circle cx="185" cy="135" r="14" fill="#ffffff" />
    <circle cx="117" cy="135" r="7" fill="#090d16" />
    <circle cx="187" cy="135" r="7" fill="#090d16" />
    <circle cx="120" cy="132" r="3" fill="#10b981" />
    <circle cx="190" cy="132" r="3" fill="#10b981" />

    <!-- Friendly smile curve -->
    <path d="M125 170 Q150 188 175 170" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

    <!-- Bangla "ব" (Bondhu) subtle geometric heart flair -->
    <path d="M150 250 L140 270 L160 270 Z" fill="#10b981" />
  </g>
</svg>
